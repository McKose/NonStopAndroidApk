<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel taşındı — Non Stop GYM</title>
  <meta name="robots" content="noindex">

  <!--
    Panel `/panel/` altından `/admin/` altına taşındı. Bu dosya yalnızca
    yönlendirme yapıyor.

    ### Neden duruyor
    Personel bu adresi biliyor ve tarayıcı yer imlerinde tutuyor. Klasör
    silinip bırakılsaydı yer imine tıklayan kişi 404 görür ve panelin
    kapandığını sanardı — oysa yalnızca adresi değişti.

    ### Neden hem `meta refresh` hem bağlantı
    GitHub Pages sunucu tarafında yönlendirme yapamıyor (301 yok), tek yol
    HTML. `meta refresh` çalışmazsa (bazı kurumsal tarayıcı ayarları
    engelliyor) ekranda tıklanabilir bir bağlantı kalıyor; sessiz bir boş
    sayfa kalmıyor.

    ### Yol kökten (`/admin/`)
    Göreli yazılsaydı (`../admin/`) yayın yedeği adresinde de doğru çalışırdı
    ama burada asıl adres önemli. Kökten yol, `nonstopstudio.tr/panel/`
    isteğini doğrudan `nonstopstudio.tr/admin/` adresine götürüyor.
  -->
  <meta http-equiv="refresh" content="0; url=/admin/">
  <link rel="canonical" href="/admin/">
  <link rel="icon" href="/varliklar/nonstop-gym.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
</head>
<body>

<main>
  <section class="bolum">
    <p class="ust-baslik">Panel</p>
    <h1 class="bolum-baslik">Panelin adresi değişti</h1>
    <p class="bolum-alt" style="max-width:52ch">
      Yönetim paneli artık <strong>nonstopstudio.tr/admin</strong> adresinde.
      Birkaç saniye içinde oraya yönlendirileceksiniz.
    </p>
    <div class="kahraman-dugmeler">
      <a class="dugme dugme-birincil dugme-buyuk" href="/admin/">Panele git</a>
    </div>
    <p class="bolum-alt" style="max-width:52ch;margin-top:22px">
      Yer imlerinizi güncellemeyi unutmayın.
    </p>
  </section>
</main>

</body>
</html>
