    Bedeli: yayın yedeği adresinde (`mckose.github.io/NonStopAndroidApk/`)
    kökten yollar alan adının köküne gider ve stil yüklenmez. Kabul edildi —
    o adres yalnızca alan adı bozulduğunda kullanılan bir yedek, 404 sayfası
    ise asıl adreste her gün karşımıza çıkabilir.
  -->
  <link rel="icon" href="/varliklar/nonstop-gym.svg" type="image/svg+xml">
