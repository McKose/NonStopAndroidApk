name: Paneli yayınla

# Web panelini GitHub Pages'e yayınlar.
#
# Panelin derleme adımı yok ve olmayacak: dosyalar olduğu gibi kopyalanıyor.
# Buradaki tek "derleme" işi, depoya işlenmeyen `config.js` dosyasını depo gizli
# anahtarlarından üretmek — APK tarafındaki desenin aynısı.
#
# Ayrı bir iş akışı, `android.yml` içine eklenmiş bir job değil. Gerekçe: o iş
# akışı her PR'da koşuyor ve `pages` izinleri istiyor; yayınlama ise yalnızca
# master'a merge sonrası anlamlı. İkisini ayırmak, PR koşularının yayın izniyle
# dolaşmasını da önlüyor.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/panel-yayin.yml'
  workflow_dispatch:

# `deploy-pages` bunları istiyor. `contents: read` bilinçli olarak yazma değil:
# yayınlama işinin depoya bir şey yazması gerekmiyor.
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın. `cancel-in-progress: false` çünkü yarıda kesilen bir
# yayın, sitenin yarısı eski yarısı yeni kalmasına yol açabilir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    name: GitHub Pages'e gönder
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Pages'in depo ayarlarından AÇILMIŞ olması gerekiyor; iş akışı bunu
      # kendisi yapamıyor.
      #
      # İlk denemede `actions/configure-pages` adımına `enablement: true`
      # verilmişti — çalışmadı: varsayılan `GITHUB_TOKEN` Pages sitesi
      # oluşturamıyor ve hata "Resource not accessible by integration" diye
      # dönüyor. O mesaj ne yapılması gerektiğini söylemiyor, bu yüzden önce
      # okunur bir kontrol var.
      - name: Pages açık mı
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kod=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$kod" = "404" ]; then
            echo "::error::GitHub Pages bu depoda açık değil."
            echo "Tek seferlik ayar: depo -> Settings -> Pages ->"
            echo "  'Build and deployment' -> Source = GitHub Actions"
            echo "Adres: https://github.com/$GITHUB_REPOSITORY/settings/pages"
            echo "Ayarladıktan sonra bu iş akışını yeniden çalıştırın."
            exit 1
          fi
          echo "Pages açık (HTTP $kod)."

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      # Yayınlanacak dosyalar `index.html`ten başlayıp importlar izlenerek
      # TÜRETİLİYOR, elle sayılmıyor.
      #
      # Eskiden elle sayılıyordu ve tam olarak beklenen şey oldu: panele dört
      # yeni modül eklendi, listeye yazılmadı ve yayınlanan panel bomboş açıldı.
      # Sebebi de görünmüyordu — bir ES modülü importu 404 alırsa onu içe alan
      # dosya TAMAMEN yüklenmiyor, yani eksik tek dosya bütün paneli düşürüyor.
      # Üstelik CI yeşildi: testler depodaki dosyaları okuyor, yayınlananları
      # değil.
      #
      # Elle listenin gerekçesi geçerliydi ve korunuyor: `web/` altında testler,
      # `config.example.js` ve önizleme üreticisi de var; onlar yayına ait değil.
      # Türetme bunu kendiliğinden sağlıyor — hiçbir şey onları içe almıyor.
      - name: Yayınlanacak dosyaları topla
        run: |
          mkdir -p _site
          # Betik referans verilip bulunamayan bir dosya görürse sıfırdan farklı
          # kodla çıkıyor; `set -e` ile zincir orada kesilir.
          node web/yayin-dosyalari.mjs > /tmp/yayin-listesi.txt
          if [ ! -s /tmp/yayin-listesi.txt ]; then
            echo "::error::Yayın listesi boş — giriş noktası bulunamadı."
            exit 1
          fi
          while IFS= read -r dosya; do
            [ -n "$dosya" ] || continue
            mkdir -p "_site/$(dirname "$dosya")"
            cp "web/$dosya" "_site/$dosya"
          done < /tmp/yayin-listesi.txt
          # Hiçbir sayfanın REFERANS VERMEDİĞİ kök dosyalar: `CNAME`,
          # `robots.txt`, `sitemap.xml`. Tarayıcı bunları bir bağlantıdan
          # değil, bilinen adresten istiyor; dolayısıyla türetme onları
          # bulamıyor.
          #
          # Liste burada ELLE sayılmıyor, betikten geliyor. Eskiden yalnızca
          # `CNAME` vardı ve bu satırlar elle yazılmıştı; ikinci dosya
          # eklendiğinde aynı hata sınıfı geri gelirdi — dosya depoya girer,
          # kopyalama satırı yazılmaz, yayın yeşil biter ve dosya sitede
          # olmaz. Betik eksik olanı görürse yukarıdaki adımda çıkış kodu
          # sıfırdan farklı dönüyor.
          #
          # DİKKAT — `CNAME` tek başına YETMİYOR: Actions ile yayınlanan bir
          # sitede alan adının yetkili kaynağı Settings → Pages; yapıtın
          # içindeki CNAME onu kaydetmiyor. 18.08.2026'da bu yüzden yayın
          # yeşil bitti ama site alan adında 404 verdi. Dosya yine de
          # kopyalanıyor (dal tabanlı yayına düşülürse gerekiyor) ve
          # aşağıdaki son adım ayarın gerçekten etkin olup olmadığını
          # kontrol ediyor.
          for ek in $(node web/yayin-dosyalari.mjs --yapilandirma); do
            cp "web/$ek" "_site/$ek"
            echo "Yapılandırma dosyası: $ek"
          done
          echo "Özel alan adı: $(cat _site/CNAME)"

          echo "Yayınlanacak dosyalar:"; (cd _site && find . -type f | sort)

      # Ayarlar depoda tutulmuyor; APK'daki desenin aynısı.
      #
      # Değerler yoksa dosya HİÇ yazılmıyor ve panel "Kurulum tamamlanmamış"
      # diyor — ama `?demo` ile yine açılıyor. Yayını düşürmek, ayarları
      # olmayan birinin panele hiç bakamaması demek olurdu.
      - name: Sunucu ayarlarını yaz (varsa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # İsteğe bağlı. Yoksa üye KAYDI kapalı kalıyor (ekranda söylüyor);
          # panel, üye girişi ve açılış sayfası etkilenmiyor. Zorunlu
          # yapılsaydı, tek bir eksik gizli anahtar yüzünden site hiç
          # yapılandırılmamış gibi açılırdı.
          SUPABASE_TENANT_ID: ${{ secrets.SUPABASE_TENANT_ID }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            if [ -z "$SUPABASE_TENANT_ID" ]; then
              echo "UYARI: SUPABASE_TENANT_ID tanımlı değil — üye kaydı kapalı olacak."
              echo "Değeri panelde 'Üye Hesapları' sekmesinin altında yazıyor."
            fi
            # Hedef, `config.js`i ARAYAN dizinlerden türetiliyor; sabit
            # `_site/config.js` değil.
            #
            # Panel iki kez taşındı: önce köke yakın bir yerden `/panel/`
            # altına, sonra `/admin/` altına. Sabit bir yol her ikisinde de
            # sessizce yanlış olurdu — dosya kökte kalır, panel onu kendi
            # dizininde arar, "Kurulum tamamlanmamış" der ve yayın yeşil
            # görünür. Türetme her iki taşımada da doğru hedefi kendiliğinden
            # buldu.
            hedefler=$(node web/yayin-dosyalari.mjs --uretilen)
            if [ -z "$hedefler" ]; then
              echo "::error::config.js'i arayan hiçbir yüzey yok — beklenmedik."
              exit 1
            fi
            for hedef in $hedefler; do
            mkdir -p "_site/$(dirname "$hedef")"
            cat > "_site/$hedef" <<EOF
          window.NONSTOP_CONFIG = {
            url: "$SUPABASE_URL",
            anonKey: "$SUPABASE_ANON_KEY",
            tenantId: "$SUPABASE_TENANT_ID",
          };
          EOF
              echo "config.js yazıldı: $hedef"
            done
          else
            echo "UYARI: SUPABASE_URL / SUPABASE_ANON_KEY tanımlı değil."
            echo "Panel yayınlanacak ama 'Kurulum tamamlanmamış' diyecek."
            echo "Yine de ?demo ile açılabilir."
          fi

      - name: Yapıtı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Yayınla
        id: dagitim
        uses: actions/deploy-pages@v4

      # Yayınlanan adres beklenen alan adı mı?
      #
      # 18.08.2026'da tam olarak şu yaşandı: yayın YEŞİL bitti, bütün dosyalar
      # (CNAME dâhil) doğru gönderildi, ama site `nonstopstudio.tr` adresinde
      # "There isn't a GitHub Pages site here" verdi. Sebep, Pages ayarlarındaki
      # **özel alan adı** kaydının düşmüş olmasıydı; günlükteki tek belirti
      # `Evaluated environment url: https://mckose.github.io/...` satırıydı ve
      # onu kimse okumuyordu.
      #
      # Buradaki ders şu: yapıtın içindeki `CNAME` dosyası, Actions ile
      # yayınlanan bir sitede alan adını KENDİ BAŞINA kaydetmiyor — yetkili
      # kaynak Settings → Pages. Dosya yine de duruyor (dal tabanlı yayına
      # düşülürse gerekiyor), ama ona güvenmek yetmiyor.
      #
      # Bu adım işi DÜŞÜRMÜYOR: site github.io adresinde gerçekten yayında ve
      # yayını kırmızıya boyamak, çalışan bir dağıtımı başarısız göstermek
      # olurdu. Yaptığı şey, sessiz olanı görünür kılmak.
      - name: Özel alan adı gerçekten etkin mi
        if: always() && steps.dagitim.outcome == 'success'
        env:
          YAYIN_ADRESI: ${{ steps.dagitim.outputs.page_url }}
        run: |
          if [ ! -f web/CNAME ]; then
            echo "web/CNAME yok — özel alan adı beklenmiyor, kontrol atlandı."
            exit 0
          fi
          beklenen=$(tr -d '[:space:]' < web/CNAME)
          echo "Beklenen alan adı : $beklenen"
          echo "Yayınlanan adres  : $YAYIN_ADRESI"

          case "$YAYIN_ADRESI" in
            *"$beklenen"*)
              echo "Özel alan adı etkin."
              ;;
            *)
              echo "::warning title=Özel alan adı etkin değil::Site \"$beklenen\" yerine $YAYIN_ADRESI adresinde yayınlandı. Settings → Pages → Custom domain alanına \"$beklenen\" yazıp kaydedin; DNS kontrolü geçtikten sonra Enforce HTTPS'i işaretleyin. Alan adına giren ziyaretçiler o ana kadar GitHub'ın 404 sayfasını görür."
              ;;
          esac
