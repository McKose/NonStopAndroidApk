name: Android CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  # `ready_for_review` varsayılan tetikleyiciler arasında değil; onsuz PR'ı
  # taslaktan çıkarmak iOS işini hiç başlatmazdı.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve testleri çalıştır
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4

      # Ortak (metadata) derlemesi Linux'ta da koşabiliyor ve bağımlılıkların
      # klib'lerini gerçekten çözüyor. Değeri: KMP bağımlılıklarından biri bizim
      # Kotlin sürümümüzden yeni bir derleyiciyle üretilmişse ("KLIB resolver:
      # incompatible ABI version") hata burada, 1x ücretli koşucuda çıkar —
      # yoksa aynı hatayı ancak 10x ücretli macOS işinde görürdük. Bu adım
      # tam olarak PR #18'de Koin 4.2.2 ile yaşanan turu önlemek için var.
      - name: Ortak kod (metadata) derle — KMP bağımlılık uyumu
        run: ./gradlew --no-daemon :shared:compileCommonMainKotlinMetadata

      # Ortak modülün testleri iş kurallarının tamamını kapsıyor; Android'e özgü
      # kod barındırmadığı için buradaki sonuç iOS için de geçerli.
      - name: Ortak modül testleri
        run: ./gradlew --no-daemon :shared:testDebugUnitTest

      # Veritabanı testleri JVM hedefinde: gerçek SQLite üzerinde koşuyorlar.
      # Android birim testlerinde koşamazlar (gömülü sürücünün Android sürümü
      # masaüstü JVM'de yüklenemiyor), iOS'ta koşsalar 10x ücretli olurlardı.
      - name: Veritabanı testleri (JVM)
        run: ./gradlew --no-daemon :shared:jvmTest

      # "Yeşil" ile "koştu" aynı şey değil: kaynak dizini yanlış olsaydı görev
      # hiç test bulamaz ve yine de başarılı sayılırdı. Bu adım sonuç dosyalarını
      # sayıp sıfırsa işi düşürüyor — test altyapısının kendisi de doğrulanmalı.
      - name: Veritabanı testlerinin koştuğunu doğrula
        run: |
          results="shared/build/test-results/jvmTest"
          if [ ! -d "$results" ]; then
            echo "HATA: $results yok — jvmTest hiç test bulamamış."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml \
            | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }')
          echo "Koşan veritabanı testi: ${total:-0}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "HATA: hiç test koşmamış."
            exit 1
          fi

      - name: Uygulama birim testleri
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug APK derle
        run: ./gradlew --no-daemon :app:assembleDebug

      # Test raporu, hata durumunda hangi assert'in patladığını görebilmek için.
      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Room'un ürettiği şema anlık görüntüleri. Depoda tutulmadıkları sürece
      # migration testi yazmak mümkün değil: MigrationTestHelper eski sürümün
      # veritabanını bu JSON'lardan kuruyor. Şu an hiçbiri işlenmiş değil.
      - name: Şema anlık görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: shared/schemas/
          retention-days: 7
          if-no-files-found: warn

  # Sunucu şeması ve erişim kuralları. Ubuntu koşucusu, 1x ücret.
  #
  # Salon yalıtımı yalnızca satır bazlı güvenlik kurallarına dayanıyor ve yanlış
  # yazılmış bir kural sessizdir: uygulama çalışır, testler geçer, veri sızar.
  # Bu yüzden kuralın kendisi her koşuda gerçek bir PostgreSQL üzerinde sınanıyor.
  supabase:
    name: Sunucu şeması ve erişim kuralları
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Şemayı uygula ve salon yalıtımını sına
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh

  # Değişikliğin Kotlin/Native derlemesini etkileyip etkilemediğini belirler.
  #
  # Yalnızca SQL, belge ya da CI dosyası değişen bir PR'da macOS işini koşturmak
  # 10x ücreti hiçbir şey doğrulamadan harcamak demek. Üçüncü taraf bir action
  # eklemeden, düz `git diff` ile karar veriliyor.
  #
  # Yön bilinçli olarak **güvenli tarafa** eğik: karar veremediğimiz her durumda
  # (workflow_dispatch, beklenmedik bir dosya, boş taban) sonuç `true` oluyor ve
  # iOS işi koşuyor. Ters kurgu — tanıdık desenleri arayıp bulunca koşmak —
  # desende bir eksik kalınca doğrulamayı sessizce kaybettirirdi; bu kurguda aynı
  # hata yalnızca gereksiz bir tur maliyetine yol açar.
  degisiklik-kapsami:
    name: Değişiklik kapsamını belirle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kod-degisti: ${{ steps.kontrol.outputs.kod-degisti }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: kontrol
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "PR bağlamı yok — iOS işi koşacak."
            echo "kod-degisti=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          degisenler="$(git diff --name-only "$base" "$head")"
          echo "Değişen dosyalar:"; echo "$degisenler"

          # Derlemeyi etkilemediği bilinen yollar. Bunların DIŞINDA tek bir dosya
          # bile varsa iOS işi koşar.
          if echo "$degisenler" | grep -qvE '^(docs/|supabase/|\.github/|\.agents/|\.claude/|skills-lock\.json$|.*\.md$|LICENSE$|\.gitignore$)'; then
            echo "Derlemeyi etkileyen değişiklik var."
            echo "kod-degisti=true" >> "$GITHUB_OUTPUT"
          else
            echo "Yalnızca belge/SQL/CI değişmiş — iOS işi atlanacak."
            echo "kod-degisti=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS koşucuları dakika kotasından **10 kat** düşer. Bir dilim boyunca
  # genellikle birkaç tur Android tarafındaki hataları düzeltmekle geçiyor ve o
  # turların iOS'la ilgisi olmuyor. Bu yüzden macOS işi yalnızca:
  #   - master'a merge'de,
  #   - PR taslaktan çıkarıldığında (yani "artık doğrula" dediğimizde),
  #   - elle tetiklendiğinde
  # çalışır. Taslak PR'a yapılan ara push'lar yalnızca ucuz Linux işini koşturur.
  ios:
    name: iOS framework derle (Kotlin/Native)
    runs-on: macos-latest
    timeout-minutes: 30
    # Yalnızca PR taslaktan çıkarıldığında ya da elle. master'a merge'de tekrar
    # koşmuyor: squash sonrası master'ın içeriği doğrulanan PR ağacıyla birebir
    # aynı, aynı doğrulamayı 10x ücretle ikinci kez yapmanın karşılığı yok.
    needs: degisiklik-kapsami
    if: >
      needs.degisiklik-kapsami.outputs.kod-degisti == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false))

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native derlemesi yalnızca macOS'ta yapılabiliyor. Bu iş olmadan
      # "iOS'ta çalışıyor" iddiası doğrulanmamış kalırdı: ortak kodun gerçekten
      # Apple hedefine derlendiğini kanıtlayan tek yer burası.
      - name: Simülatör framework'ü (arm64)
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64

      # Gerçek cihaz hedefi yalnızca master'da: simülatör derlemesi Kotlin/Native
      # ön ucunun geçtiğini zaten kanıtlıyor, bu adım son bir güvence.
      - name: Cihaz framework'ü (arm64)
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosArm64

      # Aynı testler Kotlin/Native üzerinde de koşuyor: JVM'de geçip Native'de
      # patlayan bir davranış farkı (yuvarlama, tarih, metin) burada yakalanır.
      - name: Ortak modül testleri (Kotlin/Native)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test
