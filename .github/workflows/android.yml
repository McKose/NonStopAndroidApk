name: Android CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  # `ready_for_review` varsayılan tetikleyiciler arasında değil; onsuz PR'ı
  # taslaktan çıkarmak iOS işini hiç başlatmazdı.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve testleri çalıştır
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4

      # Ortak (metadata) derlemesi Linux'ta da koşabiliyor ve bağımlılıkların
      # klib'lerini gerçekten çözüyor. Değeri: KMP bağımlılıklarından biri bizim
      # Kotlin sürümümüzden yeni bir derleyiciyle üretilmişse ("KLIB resolver:
      # incompatible ABI version") hata burada, 1x ücretli koşucuda çıkar —
      # yoksa aynı hatayı ancak 10x ücretli macOS işinde görürdük. Bu adım
      # tam olarak PR #18'de Koin 4.2.2 ile yaşanan turu önlemek için var.
      - name: Ortak kod (metadata) derle — KMP bağımlılık uyumu
        run: ./gradlew --no-daemon :shared:compileCommonMainKotlinMetadata

      # Ortak modülün testleri iş kurallarının tamamını kapsıyor; Android'e özgü
      # kod barındırmadığı için buradaki sonuç iOS için de geçerli.
      - name: Ortak modül testleri
        run: ./gradlew --no-daemon :shared:testDebugUnitTest

      # Veritabanı testleri JVM hedefinde: gerçek SQLite üzerinde koşuyorlar.
      # Android birim testlerinde koşamazlar (gömülü sürücünün Android sürümü
      # masaüstü JVM'de yüklenemiyor), iOS'ta koşsalar 10x ücretli olurlardı.
      - name: Veritabanı testleri (JVM)
        run: ./gradlew --no-daemon :shared:jvmTest

      # Ortak arayüz (Compose Multiplatform) ve masaüstü kabuğu. Görüntü
      # testleri ekranı GERÇEKTEN çiziyor — Skia ile, ekransız; pencere ya da
      # xvfb gerekmiyor. Derlenen ama çizilmeyen ekran mümkün olduğu için
      # derleme tek başına kanıt sayılmıyor.
      - name: Ortak arayüz derle (Android + masaüstü)
        run: ./gradlew --no-daemon :arayuz:compileDebugKotlinAndroid :masaustu:compileKotlinJvm

      - name: Ortak arayüz görüntü testleri (ekransız çizim)
        run: ./gradlew --no-daemon :arayuz:jvmTest

      # Düşen testlerin özeti, günlüğün SONUNDA.
      #
      # Gradle'ın kendi çıktısı yüzlerce satır yapıt yükleme kaydının altında
      # kalıyor ve hangi testin neden düştüğünü bulmak için günlüğü geriye
      # doğru taramak gerekiyor. JUnit XML'i zaten üretiliyor; buradan okunan
      # üç satır (sınıf, test, mesaj) aramayı tamamen gereksiz kılıyor.
      - name: Düşen testlerin özeti
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          bulundu = False
          for yol in sorted(glob.glob("*/build/test-results/**/*.xml", recursive=True)):
              try:
                  kok = ET.parse(yol).getroot()
              except ET.ParseError:
                  continue
              for test in kok.iter("testcase"):
                  for kotu in list(test.findall("failure")) + list(test.findall("error")):
                      bulundu = True
                      print(f"::error::{test.get('classname')} > {test.get('name')}")
                      print("   " + (kotu.get("message") or "").strip()[:500])
                      ilk = [s for s in (kotu.text or "").splitlines() if "com.gymapp" in s][:3]
                      for s in ilk:
                          print("   " + s.strip())
          if not bulundu:
              print("XML'de düşen test yok — hata derleme aşamasında olabilir.")
          PY

      # PNG'ler yapıt olarak: ekranların nasıl göründüğü, kod çalıştırmadan
      # buradan indirilip bakılabiliyor. `if: always()` — testler düştüğünde
      # görüntü daha da değerli, çünkü NEDEN düştüğünü gösteriyor.
      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arayuz-goruntuleri
          path: arayuz/build/goruntuler/
          if-no-files-found: ignore

      # "Yeşil" ile "koştu" aynı şey değil: kaynak dizini yanlış olsaydı görev
      # hiç test bulamaz ve yine de başarılı sayılırdı. Bu adım sonuç dosyalarını
      # sayıp sıfırsa işi düşürüyor — test altyapısının kendisi de doğrulanmalı.
      - name: Veritabanı testlerinin koştuğunu doğrula
        run: |
          results="shared/build/test-results/jvmTest"
          if [ ! -d "$results" ]; then
            echo "HATA: $results yok — jvmTest hiç test bulamamış."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml \
            | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }')
          echo "Koşan veritabanı testi: ${total:-0}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "HATA: hiç test koşmamış."
            exit 1
          fi

      # Room'un dışa aktardığı şema anlık görüntüsü depoda olmalı.
      #
      # Derleme `shared/schemas/` altına güncel sürümün JSON'unu yazıyor. O dosya
      # işlenmezse iki şey kaybediliyor: geçiş testleri eski/yeni şemayı okuyacak
      # bir kaynaktan yoksun kalıyor ve `MigrationTestHelper` hiç kullanılamıyor.
      #
      # Bu tam olarak sessizce olan bir kayıptı: `@Database(version = ...)`
      # artırıldığında hiçbir şey şikâyet etmiyor, CI yeşil kalıyor ve eksiklik
      # ancak birisi geçiş testi yazmaya çalıştığında ortaya çıkıyor. Bu adım onu
      # gürültülü hâle getiriyor.
      #
      # Düşerken dosyanın kendisini de yazdırıyor: yapıtı indirmek her ortamda
      # mümkün olmuyor (bulut depolama adresleri kurumsal ağ ilkelerince
      # engellenebiliyor), ama günlükten kopyalamak her zaman mümkün.
      - name: Şema anlık görüntüsü depoda mı
        run: |
          db="shared/src/commonMain/kotlin/com/gymapp/data/local/db/GymDatabase.kt"
          surum=$(grep -oE 'version[[:space:]]*=[[:space:]]*[0-9]+' "$db" | grep -oE '[0-9]+' | head -1)
          if [ -z "$surum" ]; then
            echo "::error::@Database sürümü $db içinden okunamadı."
            exit 1
          fi
          echo "Veritabanı sürümü: $surum"

          # Derlemenin şemayı gerçekten ürettiğini doğrula. Üretmediyse sorun
          # "işlenmemiş dosya" değil, bu adımın yanlış yerde koşması olur —
          # ikisini ayırmak, yanıltıcı bir hata mesajını önlüyor.
          uretilen=$(find shared/schemas -name "$surum.json" | head -1)
          if [ -z "$uretilen" ]; then
            echo "::error::Derleme $surum.json üretmedi. Bu adım KSP'den önce koşuyor olabilir."
            find shared/schemas -name '*.json' | sort
            exit 1
          fi

          if git diff --quiet --exit-code -- shared/schemas \
             && [ -z "$(git ls-files --others --exclude-standard -- shared/schemas)" ]; then
            echo "Şema depoda ve güncel: $uretilen"
            exit 0
          fi

          echo "::error::Room şeması depoda güncel değil — aşağıdaki dosyaları işleyin."
          git status --porcelain -- shared/schemas

          echo ""
          echo "── İçerik (gzip+base64; çözmek için: base64 -d | gunzip) ──"
          git status --porcelain -- shared/schemas | awk '{ print $NF }' | while read -r f; do
            echo ""
            echo "=== $f ==="
            gzip -9 -c "$f" | base64 -w 100
          done
          exit 1

      - name: Uygulama birim testleri
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Sunucu ayarları depoya işlenmiyor; CI'da depo gizli anahtarlarından
      # (Settings → Secrets → Actions) okunuyor. Yoksa derleme yine geçiyor ve
      # APK "sunucu ayarları eksik" ekranıyla açılıyor — düşürmek, ayarları
      # olmayan birinin hiçbir şeyi denemesini engellerdi.
      - name: Sunucu ayarlarını yaz (varsa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            # Adresin BİÇİMİ sınanıyor. Yanlış bir adresle üretilen APK
            # derlenir, kurulur ve yalnızca giriş denendiğinde "404 Invalid path
            # specified in request URL" der — yani hata üretimden saatler sonra,
            # tamamen başka bir yerde görünüyor. Bir kez tam olarak bu yaşandı.
            #
            # Kural betikte, iki iş akışında kopya durmasın diye.
            if ! tools/supabase_url_kontrol.sh "$SUPABASE_URL"; then
              echo "::error::SUPABASE_URL biçimi geçersiz — ayrıntı yukarıda."
              exit 1
            fi

            printf 'supabase.url=%s\nsupabase.anonKey=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> local.properties
            echo "Sunucu ayarları yazıldı ve adres biçimi doğrulandı."
          else
            echo "UYARI: SUPABASE_URL / SUPABASE_ANON_KEY tanımlı değil."
            echo "APK derlenecek ama giriş ekranında 'sunucu ayarları eksik' diyecek."
            echo "Eklemek için: depo Settings -> Secrets and variables -> Actions."
          fi

      - name: Debug APK derle
        run: ./gradlew --no-daemon :app:assembleDebug

      # Kurulabilir APK. Android Studio kurmadan denemenin tek yolu bu: Actions
      # sekmesinden koşuyu açıp aşağıdaki dosyayı indirmek yeterli.
      - name: Debug APK'yı yayınla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonstop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      # APK'yı tarayıcıda çalıştırılabilir hâle getirir.
      #
      # Yalnızca master'a merge sonrası: PR'larda da koşsaydı her PR Appetize
      # kotasını yakar ve paylaşılan bağlantı, birleşmemiş bir daldaki sürümü
      # gösterirdi.
      #
      # Ayrı bir iş değil, aynı işin son adımı: APK zaten burada derlendi.
      # Ayrı işte yeniden derlemek dört dakika daha CI süresi demekti.
      #
      # Token yoksa adım BAŞARISIZ OLMUYOR, atlanıyor ve sebebini yazıyor —
      # `SUPABASE_*` anahtarlarındaki desenin aynısı. Yoksa Appetize hesabı
      # olmayan biri master'a hiçbir şey birleştiremezdi.
      - name: Appetize'a yükle (master, token varsa)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "APPETIZE_API_TOKEN tanımlı değil; yükleme atlandı."
            echo "Eklemek için: Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          apk=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::error::APK bulunamadı; derleme adımı düşmüş olmalı."
            exit 1
          fi

          sonuc=$(python3 tools/appetize_runner.py \
            --file "$apk" --device pixel7 --os-version 13.0 --json) || dustu=1

          echo "$sonuc"
          durum=$(printf '%s' "$sonuc" | python3 -c \
            "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")

          if [ "$durum" = "success" ]; then
            adres=$(printf '%s' "$sonuc" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['simulator_url'])")
            anahtar=$(printf '%s' "$sonuc" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['public_key'])")
            {
              echo "## Uygulamayı tarayıcıda dene"
              echo ""
              echo "[$adres]($adres)"
            } >> "$GITHUB_STEP_SUMMARY"

            # Anahtar sabitlenmezse her koşu YENİ bir uygulama açar ve daha önce
            # paylaşılan bağlantı eski sürümde kalır.
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              {
                echo ""
                echo "> **Tek seferlik ayar:** Settings → Secrets and variables →"
                echo "> Actions → **Variables** sekmesi → \`APPETIZE_PUBLIC_KEY\` ="
                echo "> \`$anahtar\`"
                echo ">"
                echo "> Eklenmezse her koşu yeni bir uygulama açar ve bu bağlantı değişir."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Appetize yüklemesi başarısız; ayrıntı yukarıdaki JSON'da."
          fi

      # Test raporu, hata durumunda hangi assert'in patladığını görebilmek için.
      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            arayuz/build/reports/tests/
            arayuz/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Room'un ürettiği şema anlık görüntüleri. Depoda tutuluyorlar (bkz. yukarıdaki
      # "Şema anlık görüntüsü depoda mı" adımı); bu yapıt, yeni bir sürümün JSON'unu
      # depoya işlemek gerektiğinde indirme kolaylığı için duruyor.
      - name: Şema anlık görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: shared/schemas/
          retention-days: 7
          if-no-files-found: warn

  # Web panelinin iş kuralları. Bağımlılık yok, Node'un yerleşik koşucusu.
  #
  # Paneldeki kurallar (tutar biçimi, üyelik durumu, tombstone ayıklama)
  # uygulamadaki Kotlin karşılıklarının kopyası. Kopya olmaları kaçınılmaz —
  # tarayıcı Kotlin çalıştırmıyor — ama sapmaları sessiz olurdu: panel silinmiş
  # bir üyeyi listelemeye devam eder ve kimse fark etmezdi.
  panel:
    name: Web paneli testleri
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install` yok ve olmamalı: panelin bağımlılığı yok ve öyle kalmalı.
      # Bir paket eklendiği anda derleme adımı gerekir ve panel artık "dosyaları
      # kopyala, çalışsın" olmaktan çıkar.
      # Saat dilimi BİLİNÇLİ olarak UTC değil. Panel `<input type="date">`
      # değerlerini YEREL güne çeviriyor; koşucular UTC olduğu için yerel ve
      # UTC hesap birbirinin aynısı çıkıyor ve aradaki farkı bozan bir hata
      # testlerden geçerdi — ama salonun makinesinde (UTC+3) gece yarısı ile
      # 03:00 arasındaki kayıtlar aralığın dışında kalırdı.
      # Test dosyaları `find` ile bulunuyor, kabuk deseniyle değil.
      #
      # Önceki hâli `web/*.test.js` idi ve bu desen YALNIZCA `web/` kökündeki
      # tek dosyayı yakalıyordu: panel `web/panel/` altına taşındığında oradaki
      # sekiz test dosyası CI'da HİÇ koşmamaya başladı — üstelik iş yeşil
      # kalmaya devam etti, çünkü kalan tek dosya geçiyordu. Aynı sınıf hata
      # `supabase/tests/run.sh` içinde de yaşandı ve orada da dizinden okumaya
      # geçilerek kapatıldı.
      #
      # Boş liste artık AÇIKÇA düşürüyor: hiç test bulamamak, "bütün testler
      # geçti" ile aynı şey olmamalı.
      - name: Panel testleri
        run: |
          mapfile -t testler < <(find web -name '*.test.js' | sort)
          if [ ${#testler[@]} -eq 0 ]; then
            echo "::error::web/ altında hiç test dosyası yok — yol yanlış olabilir."
            exit 1
          fi
          printf 'Koşulacak test dosyaları (%d):\n' "${#testler[@]}"
          printf '  %s\n' "${testler[@]}"
          node --test "${testler[@]}"
        env:
          TZ: Europe/Istanbul

      # Appetize yükleyicisi burada sınanıyor, `build` işinde değil: o iş
      # Gradle'ı bekliyor ve bu testin Gradle ile ilgisi yok. Buraya konunca
      # sonuç dört dakika daha erken görünüyor ve ek koşucu maliyeti yok.
      #
      # Test yerel bir sahte HTTP sunucusu kuruyor; ağ erişimi gerektirmiyor.
      - name: Appetize yükleyicisi testleri
        run: python3 tools/appetize_runner_test.py

      # Sunucu adresi doğrulayıcısı burada sınanıyor, `build` işinde değil:
      # Gradle ile ilgisi yok ve bu iş dört dakika önce sonuç veriyor.
      #
      # Betiğin kendisi her derlemenin kapısında duruyor, yani iki yönde de
      # sessizce bozulabilir: bir kural kaybolursa hatalı adres yine geçer
      # (koruma yanıltıcı olur), fazla katı olursa geçerli bir adres reddedilir
      # ve bütün derlemeler durur. İkisi de sınanıyor.
      - name: Sunucu adresi doğrulayıcısı testleri
        run: tools/supabase_url_kontrol_test.sh

  # Sunucu şeması ve erişim kuralları. Ubuntu koşucusu, 1x ücret.
  #
  # Salon yalıtımı yalnızca satır bazlı güvenlik kurallarına dayanıyor ve yanlış
  # yazılmış bir kural sessizdir: uygulama çalışır, testler geçer, veri sızar.
  # Bu yüzden kuralın kendisi her koşuda gerçek bir PostgreSQL üzerinde sınanıyor.
  supabase:
    name: Sunucu şeması ve erişim kuralları
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Şemayı uygula ve salon yalıtımını sına
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh

  # Değişikliğin Kotlin/Native derlemesini etkileyip etkilemediğini belirler.
  #
  # Yalnızca SQL, belge ya da CI dosyası değişen bir PR'da macOS işini koşturmak
  # 10x ücreti hiçbir şey doğrulamadan harcamak demek. Üçüncü taraf bir action
  # eklemeden, düz `git diff` ile karar veriliyor.
  #
  # Yön bilinçli olarak **güvenli tarafa** eğik: karar veremediğimiz her durumda
  # (workflow_dispatch, beklenmedik bir dosya, boş taban) sonuç `true` oluyor ve
  # iOS işi koşuyor. Ters kurgu — tanıdık desenleri arayıp bulunca koşmak —
  # desende bir eksik kalınca doğrulamayı sessizce kaybettirirdi; bu kurguda aynı
  # hata yalnızca gereksiz bir tur maliyetine yol açar.
  degisiklik-kapsami:
    name: Değişiklik kapsamını belirle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kod-degisti: ${{ steps.kontrol.outputs.kod-degisti }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: kontrol
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "PR bağlamı yok — iOS işi koşacak."
            echo "kod-degisti=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          degisenler="$(git diff --name-only "$base" "$head")"
          echo "Değişen dosyalar:"; echo "$degisenler"

          # Derlemeyi etkilemediği bilinen yollar. Bunların DIŞINDA tek bir dosya
          # bile varsa iOS işi koşar.
          #
          # `tools/` listede: oradaki betikler derleme sonrası çalışan yardımcı
          # araçlar (Appetize yükleyicisi), Kotlin kaynağına girmiyorlar. Kendi
          # testleri ucuz Linux işinde koşuyor; 10x ücretli macOS işini
          # tetiklemelerinin karşılığı yok.
          if echo "$degisenler" | grep -qvE '^(docs/|supabase/|web/|tools/|\.github/|\.agents/|\.claude/|skills-lock\.json$|.*\.md$|LICENSE$|\.gitignore$)'; then
            echo "Derlemeyi etkileyen değişiklik var."
            echo "kod-degisti=true" >> "$GITHUB_OUTPUT"
          else
            echo "Yalnızca belge/SQL/CI değişmiş — iOS işi atlanacak."
            echo "kod-degisti=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS koşucuları dakika kotasından **10 kat** düşer. Bir dilim boyunca
  # genellikle birkaç tur Android tarafındaki hataları düzeltmekle geçiyor ve o
  # turların iOS'la ilgisi olmuyor. Bu yüzden macOS işi yalnızca:
  #   - master'a merge'de,
  #   - PR taslaktan çıkarıldığında (yani "artık doğrula" dediğimizde),
  #   - elle tetiklendiğinde
  # çalışır. Taslak PR'a yapılan ara push'lar yalnızca ucuz Linux işini koşturur.
  ios:
    name: iOS framework derle (Kotlin/Native)
    runs-on: macos-latest
    timeout-minutes: 30
    # Yalnızca PR taslaktan çıkarıldığında ya da elle. master'a merge'de tekrar
    # koşmuyor: squash sonrası master'ın içeriği doğrulanan PR ağacıyla birebir
    # aynı, aynı doğrulamayı 10x ücretle ikinci kez yapmanın karşılığı yok.
    needs: degisiklik-kapsami
    if: >
      needs.degisiklik-kapsami.outputs.kod-degisti == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false))

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native derlemesi yalnızca macOS'ta yapılabiliyor. Bu iş olmadan
      # "iOS'ta çalışıyor" iddiası doğrulanmamış kalırdı: ortak kodun gerçekten
      # Apple hedefine derlendiğini kanıtlayan tek yer burası.
      - name: Simülatör framework'ü (arm64)
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64

      # Gerçek cihaz hedefi yalnızca master'da: simülatör derlemesi Kotlin/Native
      # ön ucunun geçtiğini zaten kanıtlıyor, bu adım son bir güvence.
      - name: Cihaz framework'ü (arm64)
        run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosArm64

      # Aynı testler Kotlin/Native üzerinde de koşuyor: JVM'de geçip Native'de
      # patlayan bir davranış farkı (yuvarlama, tarih, metin) burada yakalanır.
      - name: Ortak modül testleri (Kotlin/Native)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      # Ortak ARAYÜZ de Apple hedefine derleniyor. i1'de yalnızca derleme
      # (klib) — framework'e i4'te, iOS kabuğu gelince bağlanacak. Şimdiden
      # buradaki sebebi: Compose Multiplatform'un Kotlin/Native tarafında bir
      # uyumsuzluk varsa 13 ekran taşındıktan sonra değil, ilk PR'da görülsün.
      - name: Ortak arayüz (Kotlin/Native derlemesi)
        run: ./gradlew --no-daemon :arayuz:compileKotlinIosSimulatorArm64 :arayuz:compileKotlinIosArm64
