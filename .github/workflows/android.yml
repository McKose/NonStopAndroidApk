name: Android CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve testleri çalıştır
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug APK derle
        run: ./gradlew --no-daemon :app:assembleDebug

      # Test raporu, hata durumunda hangi assert'in patladığını görebilmek için.
      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
