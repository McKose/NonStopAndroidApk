name: Admin panelini yayınla (Turhost)

# Yönetim panelini `admin.nonstopstudio.tr` adresine, Turhost hostingine gönderir.
#
# ## Neden GitHub Pages değil
#
# Pages **site başına yalnızca bir** özel alan adı kabul ediyor ve o ad şu an
# `nonstopstudio.tr`. Alt alan adına DNS kaydı açmak yetmiyor: Pages, kendisine
# gelen ama kanonik olmayan her istek için 301 basıp ziyaretçiyi
# `nonstopstudio.tr`ye geri gönderiyor. Yani `admin.nonstopstudio.tr` bir CNAME
# ile Pages'e bakarsa panel açılmaz, açılış sayfası açılır. Bu, denenmeden
# doğru görünen ve denendiğinde sessizce yanlış çıkan bir kurulum — bu yüzden
# burada yazılı duruyor.
#
# Alan adının DNS'i zaten Turhost'ta. Panel de derleme adımı olmayan düz statik
# dosyalardan ibaret. Dolayısıyla en kısa yol, paneli Turhost'un kendi
# hostingine koyup alt alan adını oraya bağlamak.
#
# ## Panel iki yerde birden duruyor ve bu bilinçli
#
# `nonstopstudio.tr/panel/` (Pages) kalmaya devam ediyor. Turhost tarafı
# hazır değilken tek kopyayı oraya taşımak, panelin bir süre HİÇ açılmaması
# demek olurdu. İkisi de aynı depodan, aynı listeden yayınlanıyor; ayrışma
# ihtimali yok. Admin adresi çalıştığı doğrulandıktan sonra Pages kopyası
# kaldırılabilir — bu bir karar, iş akışının varsayımı değil.
#
# ## Ayarlar yoksa iş akışı DÜŞMÜYOR
#
# Turhost bilgileri tanımlı değilse yayın atlanıyor ve sebebi yazılıyor.
# Kırmızıya boyansaydı, Turhost hostingi henüz alınmadığı için her master
# merge'ü başarısız görünürdü — ve gerçek bir hata bu gürültünün içinde
# kaybolurdu.

on:
  push:
    branches: [master]
    paths:
      - 'web/panel/**'
      - 'web/varliklar/**'
      - 'web/yayin-dosyalari.mjs'
      - '.github/workflows/admin-yayin.yml'
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın: yarıda kesilen bir FTP aktarımı, panelin yarısı eski
# yarısı yeni kalmasına yol açar. `cancel-in-progress: false` bunun için.
concurrency:
  group: admin-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    name: Turhost'a gönder
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Bilgiler eksikse burada durup sebebini yazıyoruz.
      #
      # `TURHOST_FTP_DIZIN` bilerek **secret değil, variable**: aşağıdaki
      # güvenlik kontrolleri ve hata mesajları o değeri EKRANA YAZMAK zorunda.
      # Secret olsaydı GitHub onu `***` ile maskelerdi ve "yanlış dizin"
      # hatası okunamaz hâle gelirdi — hem de gizlenecek bir şey olmadan:
      # dizin yolu bir sır değil, parola sır.
      - name: Turhost bilgileri var mı
        id: ayar
        env:
          SUNUCU: ${{ secrets.TURHOST_FTP_SUNUCU }}
          KULLANICI: ${{ secrets.TURHOST_FTP_KULLANICI }}
          SIFRE: ${{ secrets.TURHOST_FTP_SIFRE }}
          DIZIN: ${{ vars.TURHOST_FTP_DIZIN }}
        run: |
          eksik=""
          [ -n "$SUNUCU" ]    || eksik="$eksik TURHOST_FTP_SUNUCU(secret)"
          [ -n "$KULLANICI" ] || eksik="$eksik TURHOST_FTP_KULLANICI(secret)"
          [ -n "$SIFRE" ]     || eksik="$eksik TURHOST_FTP_SIFRE(secret)"
          [ -n "$DIZIN" ]     || eksik="$eksik TURHOST_FTP_DIZIN(variable)"

          if [ -n "$eksik" ]; then
            echo "atla=evet" >> "$GITHUB_OUTPUT"
            echo "::notice title=Admin yayını atlandı::Tanımlı olmayan ayarlar:$eksik — kurulum adımları docs/admin-alan-adi.md içinde."
            exit 0
          fi

          # Parola aktarım betiğine çift tırnak içinde yazılıyor. Virgül,
          # boşluk ve `@` sorun değil; çift tırnak ve ters bölü betiği bozar
          # ve hata "syntax" diye çıkıp parolayı işaret etmez. Burada, parolayı
          # ekrana yazmadan, baştan söylüyoruz.
          case "$SIFRE" in
            *'"'*|*'\'*)
              echo "::error::FTP parolası çift tırnak (\") ya da ters bölü (\\) içeriyor; aktarım betiği bu iki karakteri güvenle taşıyamıyor. Turhost panelinden parolayı bunlar olmadan değiştirip secret'ı güncelleyin."
              exit 1
              ;;
          esac

          # `mirror --delete` kullanılıyor: yanlış dizin, sitenin tamamını
          # silmek demek. Kök ve ona yakın yollar baştan reddediliyor.
          case "$DIZIN" in
            ""|"/"|"."|"./"|"~"|"~/")
              echo "::error::TURHOST_FTP_DIZIN kök dizin olamaz (verilen: '$DIZIN'). Alt alan adının kendi klasörünü verin, ör. /admin.nonstopstudio.tr"
              exit 1
              ;;
            "public_html"|"/public_html"|"public_html/"|"/public_html/")
              echo "::error::TURHOST_FTP_DIZIN ana sitenin kökünü gösteriyor ('$DIZIN'). Bu, ana siteyi panelle değiştirirdi. Alt alan adının klasörünü verin."
              exit 1
              ;;
          esac

          echo "atla=hayir" >> "$GITHUB_OUTPUT"
          echo "Hedef dizin: $DIZIN"

      # Yayınlanacak dosyalar TÜRETİLİYOR: `panel/index.html`ten başlanıp
      # importlar ve `<link>`/`<script>` referansları izleniyor. Elle liste yok.
      #
      # Çıktı `panel/` önekli geliyor (`panel/app.js`), ama admin adresinde
      # panel KÖKTE duruyor — bu yüzden önek kırpılıyor. `varliklar/` altındaki
      # dosyalar `panel/` dışında olduğu için olduğu gibi kalıyor ve panelin
      # `../varliklar/...` yazımı kökte de doğru dosyaya gidiyor (RFC 3986,
      # kökteki `..` atılıyor).
      - name: Paketi hazırla
        if: steps.ayar.outputs.atla == 'hayir'
        run: |
          mkdir -p _admin
          node web/yayin-dosyalari.mjs --girisler=panel/index.html > /tmp/admin-listesi.txt
          if [ ! -s /tmp/admin-listesi.txt ]; then
            echo "::error::Panel yayın listesi boş — beklenmedik."
            exit 1
          fi

          while IFS= read -r dosya; do
            [ -n "$dosya" ] || continue
            hedef="${dosya#panel/}"
            mkdir -p "_admin/$(dirname "$hedef")"
            cp "web/$dosya" "_admin/$hedef"
          done < /tmp/admin-listesi.txt

          # Panel arama motorlarına kapalı. `index.html` içindeki `noindex`
          # meta etiketi asıl korumayı yapıyor; `robots.txt` onu tamamlıyor ve
          # yalnızca burada üretiliyor çünkü bir `robots.txt` ancak ALAN ADI
          # KÖKÜNDE geçerli — Pages kopyasında `/panel/robots.txt` olarak
          # dururdu ve hiçbir tarayıcı ona bakmazdı.
          cat > _admin/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

          echo "Gönderilecek dosyalar:"; (cd _admin && find . -type f | sort)

      # Ayarlar depoda tutulmuyor; Pages yayınındaki desenin aynısı.
      #
      # Değerler yoksa dosya HİÇ yazılmıyor ve panel "Kurulum tamamlanmamış"
      # diyor — ama `?demo` ile yine açılıyor.
      - name: Sunucu ayarlarını yaz (varsa)
        if: steps.ayar.outputs.atla == 'hayir'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TENANT_ID: ${{ secrets.SUPABASE_TENANT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "UYARI: SUPABASE_URL / SUPABASE_ANON_KEY tanımlı değil."
            echo "Panel gönderilecek ama 'Kurulum tamamlanmamış' diyecek."
            exit 0
          fi

          # Hedef, `config.js`i ARAYAN dizinden türetiliyor; sabit bir yol
          # panel taşındığında sessizce yanlış olurdu. Pages tarafında bu
          # `panel/config.js`; admin adresinde panel kökte olduğu için önek
          # burada da kırpılıyor.
          hedefler=$(node web/yayin-dosyalari.mjs --girisler=panel/index.html --uretilen)
          if [ -z "$hedefler" ]; then
            echo "::error::config.js'i arayan bir yüzey yok — beklenmedik."
            exit 1
          fi

          for ham in $hedefler; do
            hedef="${ham#panel/}"
            mkdir -p "_admin/$(dirname "$hedef")"
            cat > "_admin/$hedef" <<EOF
          window.NONSTOP_CONFIG = {
            url: "$SUPABASE_URL",
            anonKey: "$SUPABASE_ANON_KEY",
            tenantId: "$SUPABASE_TENANT_ID",
          };
          EOF
            echo "config.js yazıldı: $hedef"
          done

      - name: lftp kur
        if: steps.ayar.outputs.atla == 'hayir'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ## Neden `--delete` doğrudan verilmiyor
      #
      # `mirror -R --delete`, hedef dizinde paketimizde olmayan her şeyi siler.
      # Doğru dizinde bu tam olarak istenen şey (silinen bir panel modülü
      # sunucuda kalmamalı). Yanlış dizinde ise geri dönüşü olmayan bir kayıp.
      #
      # Bu yüzden silme, dizinin BİZE ait olduğu kanıtlanana kadar kapalı:
      # paket içinde `.nonstop-admin` adında bir imza dosyası gönderiliyor ve
      # `--delete` yalnızca o dosya hedefte ZATEN varsa açılıyor. Yani ilk
      # yayın hiçbir şey silmiyor; ikinciden itibaren temizlik yapılıyor.
      # Kontroller (yukarıdaki dizin süzgeci) insan hatasını azaltıyor, bu ise
      # kalanı da imkânsız kılıyor.
      #
      # Parola komut satırına DEĞİL, yalnızca sahibinin okuyabildiği bir
      # betiğe yazılıyor: `-u kullanıcı,parola` biçimi hem süreç listesinde
      # görünür hem de içinde virgül geçen bir parolayı bozar.
      - name: FTPS ile gönder
        if: steps.ayar.outputs.atla == 'hayir'
        env:
          SUNUCU: ${{ secrets.TURHOST_FTP_SUNUCU }}
          KULLANICI: ${{ secrets.TURHOST_FTP_KULLANICI }}
          SIFRE: ${{ secrets.TURHOST_FTP_SIFRE }}
          DIZIN: ${{ vars.TURHOST_FTP_DIZIN }}
          # Sertifika doğrulaması AÇIK geliyor. Turhost'un paylaşımlı
          # sunucularında sertifika çoğu zaman `*.turhost.com` adına ve FTP
          # adresiyle eşleşmiyor; o durumda bu adım "certificate common name
          # doesn't match" diye düşer. Kapatmak bir seçenek ama bedeli var:
          # bağlantı yine şifreli kalır, ancak araya giren bir sunucuyu
          # ayırt edemezsiniz. Kapatmadan önce Turhost'tan doğru FTP
          # adresini istemek daha iyi.
          DOGRULA: ${{ vars.TURHOST_FTP_SERTIFIKA_DOGRULA || 'true' }}
        run: |
          set -u
          printf 'imza\n' > _admin/.nonstop-admin

          umask 077
          onsoz=/tmp/lftp-onsoz
          {
            echo "set cmd:fail-exit true"
            echo "set net:timeout 20"
            echo "set net:max-retries 3"
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ssl:verify-certificate $DOGRULA"
            # `open` + ayrı `user`: tırnaklı iki argüman aldığı için virgül,
            # boşluk ya da `@` içeren parolalar bozulmuyor.
            printf 'open "%s"\n' "$SUNUCU"
            printf 'user "%s" "%s"\n' "$KULLANICI" "$SIFRE"
          } > "$onsoz"

          # İmza dosyası hedefte var mı? Yoksa bu ilk yayın: silme yapılmıyor.
          probe=/tmp/lftp-probe
          cp "$onsoz" "$probe"
          printf 'cd "%s"\n' "$DIZIN" >> "$probe"
          printf 'get .nonstop-admin -o /tmp/imza-uzak\n' >> "$probe"

          if lftp -f "$probe" >/dev/null 2>&1; then
            sil="--delete"
            echo "İmza dosyası bulundu — eski dosyalar temizlenecek."
          else
            sil=""
            echo "İmza dosyası yok. İLK YAYIN kabul ediliyor: hiçbir şey silinmeyecek."
            echo "Sonraki yayınlarda paketten çıkarılan dosyalar sunucudan da silinir."
          fi

          # Hedefe `cd` ile giriliyor, mirror'a yol olarak VERİLMİYOR: mirror
          # olmayan bir hedef dizini kendisi oluşturuyor, yani yolu yanlış
          # yazılmış bir yayın sessizce boş bir klasöre gider ve iş yeşil
          # biter. `cd` ise olmayan dizinde hata veriyor.
          # ## Sunucunun kendi dosyaları silmeden korunuyor
          #
          # `--delete` "pakette olmayan her şeyi sil" demek ve hedef dizinde
          # BİZE ait olmayan dosyalar da var:
          #
          #   .well-known/  Let's Encrypt sertifikayı buradan doğruluyor.
          #                 Silinseydi sertifika ilk YENİLEMEDE (90 gün)
          #                 tükenir ve panel bir sabah "güvenli değil" uyarısıyla
          #                 açılmaz olurdu. Aradaki gecikme yüzünden sebebi de
          #                 bu yayınla ilişkilendirilemezdi.
          #   .htaccess     Turhost'un ya da senin eklediğin sunucu ayarı
          #                 (https yönlendirmesi gibi). Paket üretmiyor.
          #   cgi-bin/      cPanel her doküman kökünde açıyor.
          #
          # Üçü de dışarıda bırakılıyor: ne gönderiliyor ne siliniyor.
          korunan="--exclude ^\.well-known/ --exclude ^cgi-bin/ --exclude ^\.htaccess$"

          gonder=/tmp/lftp-gonder
          cp "$onsoz" "$gonder"
          printf 'cd "%s"\n' "$DIZIN" >> "$gonder"
          printf 'mirror -R %s %s --verbose --parallel=2 _admin .\n' "$sil" "$korunan" >> "$gonder"
          printf 'bye\n' >> "$gonder"

          lftp -f "$gonder"
          echo "Gönderim tamam."

      # Adres gerçekten panelle mi açılıyor?
      #
      # Bu adım işi DÜŞÜRMÜYOR ve sebebi yaşanmış: 18.08.2026'da Pages yayını
      # yeşil bitti, bütün dosyalar doğru gönderildi, ama site alan adında 404
      # verdi — çünkü sorun dosyalarda değil, alan adı ayarındaydı. Aktarımı
      # başarılı yapan bir işi, DNS henüz yayılmadı diye kırmızıya boyamak
      # yanlış yerde alarm çalmak olurdu. Yaptığı şey, sessiz olanı görünür
      # kılmak.
      - name: Admin adresi yanıt veriyor mu
        if: steps.ayar.outputs.atla == 'hayir'
        continue-on-error: true
        env:
          ADRES: ${{ vars.ADMIN_ALAN_ADI || 'admin.nonstopstudio.tr' }}
        run: |
          kod=$(curl -sS -o /tmp/admin-yanit -w '%{http_code}' --max-time 20 \
                  "https://$ADRES/" || echo "000")
          echo "HTTP $kod — https://$ADRES/"

          if [ "$kod" = "000" ]; then
            echo "::warning title=Admin adresine ulaşılamadı::https://$ADRES/ yanıt vermedi. DNS henüz yayılmamış ya da SSL sertifikası çıkarılmamış olabilir (Turhost panelinde 'Let's Encrypt' / 'SSL Yönetimi'). Dosyalar sunucuya gönderildi."
            exit 0
          fi

          if [ "$kod" != "200" ]; then
            echo "::warning title=Admin adresi $kod döndü::Beklenen 200. Alt alan adının kök dizini TURHOST_FTP_DIZIN ile aynı mı kontrol edin."
            exit 0
          fi

          # 200 dönmesi yetmiyor: alt alan adı yanlış klasöre bağlıysa ana
          # sitenin açılış sayfası da 200 döner ve her şey yolunda görünür.
          if grep -qi 'Yönetim Paneli' /tmp/admin-yanit; then
            echo "Panel yayında."
          else
            echo "::warning title=Adres açılıyor ama panel değil::https://$ADRES/ 200 döndü, gelen sayfa panel değil. Alt alan adı büyük ihtimalle başka bir klasöre bağlı."
          fi
