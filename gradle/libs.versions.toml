[versions]
agp             = "8.13.2"
kotlin          = "2.2.21"
ksp             = "2.2.21-2.0.5"
coreKtx         = "1.16.0"
junit           = "4.13.2"
junitVersion    = "1.2.1"
espressoCore    = "3.6.1"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.1"
composeBom      = "2026.02.01"
navigationCompose = "2.9.0"

# Room
room            = "2.7.1"

# Koin — bağımlılık enjeksiyonu.
# Hilt yerine geçti: Hilt yalnızca JVM/Android'de çalışıyor, Koin ise ortak
# koddan (KMP) kullanılabiliyor. Repository katmanı :shared'e taşınabilsin diye şart.
#
# Neden 4.1.1 ve neden 4.2.x değil: Koin 4.2.0/4.2.1/4.2.2'nin Kotlin/Native
# klib'leri Kotlin 2.3.20 ile üretilmiş (abi_version=2.3.0). Kotlin 2.2.21
# derleyicisi en fazla ABI 2.2.0 okuyabildiği için iOS hedefi bu klib'i
# çözemiyor — JVM tarafı sorunsuz derlendiği hâlde `compileKotlinIosArm64`
# "KLIB resolver: incompatible ABI version" ile düşüyor. 4.1.1 Kotlin 2.1.21
# ile üretilmiş (abi_version=1.201.0) ve mevcut derleyiciyle uyumlu.
# Kotlin 2.3'e çıkıldığında (artık KSP'nin de 2.3.x sürümleri var) 4.2.x'e
# dönülebilir; o yükseltme Room/AGP/Compose'u da kapsadığı için ayrı bir dilim.
koin            = "4.1.1"

# Ktor — HTTP istemcisi (Supabase'in veri API'si PostgREST üzerinden).
#
# 3.4.0 KULLANILAMAZ: klib'leri Kotlin 2.3.0 ile üretilmiş (abi_version=2.3.0),
# bizim 2.2.21 derleyicimiz en fazla 2.2.0 okuyor. Koin 4.2.x'te aynı tuzağa
# düşülmüştü; bu kez sürüm seçilmeden önce Maven Central'daki klib manifest'i
# okundu. 3.3.1 -> abi_version=2.2.0, uyumlu.
ktor            = "3.3.1"

# kotlinx.serialization 1.9.0 -> abi_version=2.2.0, uyumlu.
kotlinxSerialization = "1.9.0"

# Kotlin Multiplatform
kotlinxDatetime = "0.6.1"
kotlinxCoroutines = "1.9.0"

# Room'un KMP tarafında kullandığı SQLite sürücüsü (Room 2.7.x ile eşleşir)
androidxSqlite  = "2.5.1"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# iOS'ta sistem SQLite'ı yerine gömülü sürücü kullanılır; sürüm farklılıklarından
# doğan davranış farkları böylece ortadan kalkar.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidxSqlite" }

# Koin
koin-core             = { group = "io.insert-koin", name = "koin-core",             version.ref = "koin" }
koin-android          = { group = "io.insert-koin", name = "koin-android",          version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Kotlin Multiplatform — ortak (commonMain) bağımlılıklar
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Ktor
ktor-client-core    = { group = "io.ktor", name = "ktor-client-core",    version.ref = "ktor" }
ktor-client-okhttp  = { group = "io.ktor", name = "ktor-client-okhttp",  version.ref = "ktor" }
ktor-client-darwin  = { group = "io.ktor", name = "ktor-client-darwin",  version.ref = "ktor" }
ktor-client-mock    = { group = "io.ktor", name = "ktor-client-mock",    version.ref = "ktor" }

# Test
junit                    = { group = "junit",               name = "junit",          version.ref = "junit" }
androidx-junit           = { group = "androidx.test.ext",   name = "junit",          version.ref = "junitVersion" }
androidx-espresso-core   = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp" }
android-library     = { id = "com.android.library",                version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
room                = { id = "androidx.room",                      version.ref = "room" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
